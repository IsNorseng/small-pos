name: Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install official Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "system-images;android-30;default;x86_64"
      - name: Build and test
        run: |
          python3 scripts/build.py --core-test --tests
          python3 tests/sqlite_check.py
      - name: Start a fresh headless emulator
        run: |
          sudo chmod a+rw /dev/kvm
          printf 'no\n' | avdmanager create avd -n small-pos-ci -k 'system-images;android-30;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd small-pos-ci -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb -s emulator-5554 wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/emulator.log"
          exit 1
      - name: Android SQLite and interface tests
        run: |
          adb -s emulator-5554 install -r build/small-pos.apk
          adb -s emulator-5554 install -r build/small-pos-tests.apk
          adb -s emulator-5554 shell am instrument -w ru.smallpos.tests/ru.smallpos.app.RetailInstrumentation | tee "$RUNNER_TEMP/android-tests.txt"
          grep -q 'PASS:' "$RUNNER_TEMP/android-tests.txt"
          ! grep -q 'FAIL\|INSTRUMENTATION_FAILED' "$RUNNER_TEMP/android-tests.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: small-pos-test-apk
          path: build/small-pos.apk
